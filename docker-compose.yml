services:
  db:
    image: postgres:16-alpine
    container_name: zw-shop-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-zw_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zw_password}
      POSTGRES_DB: ${DB_NAME:-zw_shop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zw_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: zw-shop-web
    restart: always
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - zw_network
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  zw_network:
    external: true
